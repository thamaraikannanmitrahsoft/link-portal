<div class="register-wrapper">

  <div class="register-card">

    <!-- Logo -->
   <div class="text-center mb-4">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="60"
    height="60"
    viewBox="0 0 64 64"
    fill="none"
  >
    <!-- Dark Background -->
    <circle cx="32" cy="32" r="30" fill="#0f172a" />

    <!-- Glow Effect -->
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1DA1F2"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>

      <linearGradient id="grayGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    </defs>

    <!-- Main L Shape -->
    <path
      d="M24 14L20 40C19 48 24 54 31 54H45L52 46H35C30 46 27 42 28 37L32 14H24Z"
      fill="url(#blueGradient)"
      filter="url(#glow)"
    />

    <!-- Wing Shape -->
    <path
      d="M35 32C39 24 47 21 56 18C52 24 48 29 43 32C39 35 34 36 30 37L35 32Z"
      fill="url(#blueGradient)"
      opacity="0.95"
    />

    <!-- Shadow Wing -->
    <path
      d="M34 38C40 37 46 35 50 30C48 38 43 43 36 46L28 48L34 38Z"
      fill="url(#grayGradient)"
      opacity="0.7"
    />
  </svg>
</div>

    <h2 class="register-title">Create your account</h2>
    <p class="register-subtitle">Join Link today. It's free!</p>

   
    

    <!-- Name -->
    <div class="mb-3">
      <label class="register-label">Username</label>
      <div class="register-input-prefix-wrap">
        <span class="register-input-prefix">@</span>
        <input
          type="text"
          class="register-input register-input-prefixed"
          placeholder="yourhandle"
          [formField]="registerForm.name"
        >
      </div>
      <small class="register-error">{{ errors().name }}</small>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="register-label">Email</label>
      <input
        type="email"
        class="register-input"
        placeholder="you@example.com"
        [formField]="registerForm.email"
      >
      <small class="register-error">{{ errors().email }}</small>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="register-label">Password</label>
      <input
        type="password"
        class="register-input"
        placeholder="••••••••"
        [formField]="registerForm.password"
      >
      <small class="register-error">{{ errors().password }}</small>
    </div>

   

    <!-- Register Button -->
    <button class="register-btn-primary" (click)="register()">
      Create Account
    </button>

    <!-- Divider -->
    <div class="register-divider">
      <hr class="register-divider-line">
      <span class="register-divider-text">or sign up with</span>
      <hr class="register-divider-line">
    </div>

    <!-- Google Button -->
    <button class="register-btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Login Link -->
    <p class="register-login-text">
      Already have an account?
      <a routerLink="/login" class="register-login-link">Sign In</a>
    </p>

  </div>

</div>
